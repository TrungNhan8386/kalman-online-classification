[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kfoc"
version = "0.1.0"
description = "Reproduction of 'Kalman Filter for Online Classification of Non-Stationary Data' (ICLR 2024)"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
